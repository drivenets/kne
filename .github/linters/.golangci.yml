---
version: "2"

run:
  timeout: 10m

linters:
  default: none
  enable:
    - gosec
    - unconvert
    - gocritic
    - govet
    - revive
    - staticcheck
    - unparam
    - unused
    - wastedassign
    - whitespace
  settings:
    errcheck:
      check-blank: true
    gocritic:
      disabled-checks:
        - singleCaseSwitch
        - appendAssign
    revive:
      rules:
        - name: blank-imports
          disabled: true
        - name: context-as-argument
          disabled: true
        - name: error-strings
          disabled: true
        - name: exported
          disabled: true
        - name: package-comments
          disabled: true
        - name: redefines-builtin-id
          disabled: true
        - name: unexported-return
          disabled: true
        - name: unused-parameter
          disabled: true
        - name: var-declaration
          disabled: true
    staticcheck:
      checks:
        - "all"
        - "-QF*"
        - "-ST1005"
        - "-ST1003"
        - "-S1030"
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - dupl
          - gosec
          - goconst
      - linters:
          - revive
        text: "var-naming: don't use leading k"
      - linters:
          - staticcheck
        text: "SA1019:"
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling

formatters:
  enable:
    - goimports
    - gofmt
